<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Fișierele documentului | Therapeutica</title>
</head>
<body>
<div layout:fragment="content"
     class="max-w-7xl w-full mx-auto px-4 py-8">

    <h1 class="text-2xl font-bold text-brand-navy mb-6"
        th:text="${document.numeFisier}">
        Fișierele documentului
    </h1>

    <div class="grid grid-cols-1 lg:grid-cols-4 gap-6">

        <nav aria-label="Fișierele documentului"
             class="bg-white border border-gray-200 rounded-xl p-4">
            <h2 class="font-bold text-brand-navy mb-3">Fișiere</h2>

            <ul class="space-y-2">
                <li th:each="nume, pozitie : ${numeFisiere}">
                    <a th:href="@{/documente/{id}/sursa(
                            id=${document.id},
                            index=${pozitie.index}
                       )}"
                       th:text="${nume}"
                       th:attr="aria-current=${pozitie.index == indexSelectat
                            ? 'page' : null}"
                       th:classappend="${pozitie.index == indexSelectat}
                            ? 'bg-brand-teal text-white'
                            : 'bg-gray-50 text-brand-navy hover:bg-gray-100'"
                       class="block px-3 py-3 rounded-lg break-words">
                        Fișier
                    </a>
                </li>
            </ul>
        </nav>

        <section class="lg:col-span-3 bg-white border border-gray-200 rounded-xl p-4">
            <div class="flex flex-wrap items-center justify-between gap-4 mb-4">
                <h2 class="font-bold text-brand-navy break-all"
                    th:text="${numeFisiere[indexSelectat]}">
                    Fișier selectat
                </h2>

                <a th:href="@{/documente/{id}/fisier(
                        id=${document.id},
                        index=${indexSelectat}
                   )}"
                   target="_blank"
                   rel="noopener noreferrer"
                   class="text-brand-blue font-bold underline">
                    Deschide fișierul
                </a>
                <a th:href="@{/documente/{id}/fisier(
        id=${document.id},
        index=${indexSelectat},
        descarcare=true
   )}"
                   class="text-brand-blue font-bold underline">
                    Descarcă
                </a>
            </div>

            <iframe th:if="${previzualizabil}"
                    th:src="@{/documente/{id}/fisier(
                        id=${document.id},
                        index=${indexSelectat}
                    )}"
                    th:title="${numeFisiere[indexSelectat]}"
                    class="w-full border border-gray-200 rounded-lg"
                    style="height: 75vh;">
            </iframe>

            <p th:unless="${previzualizabil}"
               class="text-gray-600">
                Folosește „Deschide fișierul” pentru a descărca acest fișier.
            </p>
        </section>

    </div>
</div>
</body>
</html>
