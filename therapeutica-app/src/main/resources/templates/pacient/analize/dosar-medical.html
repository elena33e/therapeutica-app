<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Dosar medical | Therapeutica</title>
</head>
<body>
<div layout:fragment="content"
     class="max-w-7xl w-full mx-auto px-4 py-8 space-y-6">

    <h1 class="text-3xl font-bold text-brand-navy">Dosar medical</h1>

    <div th:if="${success}" role="status"
         class="p-4 rounded-xl bg-brand-teal text-white"
         th:text="${success}"></div>

    <div th:if="${error}" role="alert"
         class="p-4 rounded-xl bg-red-50 text-red-700"
         th:text="${error}"></div>

    <form th:action="@{/analize/incarca}"
          method="post"
          enctype="multipart/form-data"
          class="bg-white border border-gray-200 rounded-xl p-6 space-y-4">

        <input type="hidden" name="pacientId" th:value="${pacientId}">

        <label for="files" class="block font-bold text-brand-navy">
            Adaugă un document
        </label>

        <p id="files-help" class="text-sm text-gray-600">
            Selectează un PDF sau imaginile documentului.
            Fișierele selectate împreună vor apărea ca un singur document.
        </p>

        <input id="files"
               name="files"
               type="file"
               multiple
               required
               accept=".pdf,.jpg,.jpeg,.png,.gif,.webp"
               aria-describedby="files-help"
               class="block w-full">

        <button type="submit"
                class="px-5 py-3 bg-brand-teal text-white font-bold rounded-lg">
            Încarcă documentul
        </button>
    </form>

    <div class="bg-white border border-gray-200 rounded-xl overflow-x-auto">
        <table class="w-full text-left">
            <thead class="bg-gray-100 text-brand-navy">
            <tr>
                <th scope="col" class="px-5 py-4">Document</th>
                <th scope="col" class="px-5 py-4">Data încărcării</th>
                <th scope="col" class="px-5 py-4">Acțiuni</th>
            </tr>
            </thead>
            <tbody class="divide-y divide-gray-100">
            <tr th:each="doc : ${documente}">
                <td class="px-5 py-4 font-medium" th:text="${doc.numeFisier}"></td>
                <td class="px-5 py-4"
                    th:text="${doc.dataIncarcare != null
                        ? #temporals.format(doc.dataIncarcare, 'dd.MM.yyyy HH:mm')
                        : '—'}"></td>
                <td class="px-5 py-4">
                    <div class="flex flex-wrap gap-4 items-center">
                        <a th:href="@{/documente/{id}/sursa(id=${doc.id})}"
                           class="text-brand-blue font-bold underline">
                            Deschide
                        </a>

                        <form th:action="@{/analize/sterge/{id}(id=${doc.id})}"
                              method="post"
                              onsubmit="return confirm('Retragi documentul din dosarul accesibil ție și medicului?');">
                            <button type="submit"
                                    class="text-red-700 font-medium underline">
                                Retrage din dosar
                            </button>
                        </form>
                    </div>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(documente)}">
                <td colspan="3" class="px-5 py-10 text-center text-gray-600">
                    Nu ai documente încărcate.
                </td>
            </tr>
            </tbody>
        </table>
    </div>

</div>
</body>
</html>
